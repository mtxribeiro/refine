background {
    path = ~/Imagens/Wallpapers/current.jpg
    blur_passes = 1
    contrast = 0.9
    brightness = 0.815
    vibrancy = 0.165
}

label {
    text = cmd[update:60000] date +"%A, %d de %B"
    color = rgba(216, 222, 233, 0.9)
    font_size = 25
    font_family = Noto Sans Bold
    position = 0, 350
}

label {
    text = $TIME
    color = rgba(216, 222, 233, 0.9)
    font_size = 120
    font_family = Noto Sans Bold
    position = 0, 230
}

input-field {
    size = 280, 55
    outline_thickness = 2
    dots_size = 0.2
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(255, 255, 255, 0.1)
    font_color = rgb(200, 200, 200)
    font_family = Noto Sans Bold
    placeholder_text = <i></i>
    fail_text = <i></i>
    position = 0, -210
}
